appId: dev.scalefinder.app
productName: Scale Finder
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - server/**/*
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Scale Finder
